<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Learn, Build, Solve, Open source</title>
  <desc id="desc">A practical path from learning through building and solving to useful open-source work. Understand the why. Build the how.</desc>

  <rect x="1" y="1" width="1198" height="258" rx="26" fill="#101722" stroke="#2b3a4e" stroke-width="2"/>

  <text x="58" y="46"
        fill="#8fa2b8"
        font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18"
        font-weight="700"
        letter-spacing="3">A PRACTICAL PATH</text>

  <path d="M145 132 C 276 126, 320 138, 432 132 S 615 130, 730 132 S 910 136, 1050 132"
        fill="none" stroke="#40536b" stroke-width="8" stroke-linecap="round"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
     text-anchor="middle">
    <circle cx="145" cy="132" r="27" fill="#101722" stroke="#5ab0ff" stroke-width="8"/>
    <circle cx="432" cy="132" r="27" fill="#101722" stroke="#f4bd5d" stroke-width="8"/>
    <circle cx="730" cy="132" r="27" fill="#101722" stroke="#56d39b" stroke-width="8"/>
    <circle cx="1050" cy="132" r="27" fill="#101722" stroke="#c39aff" stroke-width="8"/>

    <text x="145" y="91" fill="#f4f7fb" font-size="38" font-weight="800" letter-spacing="1.5">LEARN</text>
    <text x="432" y="91" filll="#f4f7fb" font-size="38" font-weight="800" letter-spacing="1.5">BUILD</text>
    <text x="730" y="91" filll="#f4f7fb" font-size="38" font-weight="800" letter-spacing="1.5">SOLVE</text>
    <text x="1050" y="91" fill="#f4f7fb" font-size="38" font-weight="800" letter-spacing="1.2">OPEN SOURCE</text>
  </g>

  <g transform="rotate(-1.1 600 214)">
    <text x="600" y="215"
          fill="#66b7ff"
          text-anchor="middle"
          font-family="'Bradley Hand', 'Comic Sans MS', cursive"
          font-size="32"
          font-style="italic"
          font-weight="700">understand the why. build the how.</text>
    <path d="M365 226 C 485 243, 690 235, 835 225"
          fill="none" stroke="#66b7ff" stroke-width="4" stroke-linecap="round" opacity="0.82"/>
    <path d="M827 218 L 846 225 L 830 237"
          fill="none" stroke="#66b7ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.82"/>
  </g>
</svg>
